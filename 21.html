<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ergonomika</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #f1f5f9; color: #222222; border-radius: 12px; }
h1 { color: #f804e4; }
.noteikumi { background-color: #f6fa04; padding: 12px; border-radius: 12px; }
.vadiba { background-color: #04f8af; color: #000000; padding: 12px; border-radius: 12px; }
button { background-color: #fd0a0a; color: #000000; border-radius: 12px; }
</style>
</head>
<body>
<h1>Ergonomika</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
<ul>
    <li>Kļūsti par īstu ergo fanu</li>
    <li>Savāc visus ergo gardumus</li>
  </ul>
</section>
<section class="vadiba">
  <h2>Vadība</h2>
  <p>Spēli vadi ar bulttaustiņiem.</p>
</section>
<button>Sākt spēli</button>
</body>
</html>
